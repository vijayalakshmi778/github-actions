name: Github Actions CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v4
      
      - name: Show current user
        run: whoami

      - name: List project files
        run: ls -a 
      
      - name: Execute files
        run: |
              chmod +x app.sh 
              chmod +x test.sh
      
      - name: Run application
        run: ./app.sh

      - name: Run test
        run: ./test.sh

      - name: Success
        run: echo " Completed"